<div class="caption"><strong>《晚山》— 套色版画习作</strong><span>钴蓝　朱红　象牙白</span></div></section>
<section id="notes" class="notes"><div class="shell"><h2>制作手记</h2><p>这幅画先有山线，再有太阳。先用钴蓝压住山脊，把远处的山印淡；再单独叠一层朱红。前景的细线沿地势折返，留出的纸色让山坡之间透进一点光。</p></div></section></main>
